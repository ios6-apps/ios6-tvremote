name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  simulator:
    name: Simulator build and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build for the simulator
        run: ./build.sh sim
      - name: Run tests
        run: tests/run.sh
  device:
    name: iOS 6 device build (armv7)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the iOS 9.3 SDK stubs
        run: tools/setup-sdk.sh .sdk | tail -1 | sed -e 's/^export //' -e 's/"//g' >> "$GITHUB_ENV"
      - name: Stamp the build number
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Info.plist
      - name: Build the unsigned IPA
        run: ./build.sh device
      - uses: actions/upload-artifact@v4
        with:
          name: TVRemote.ipa
          path: build/TVRemote.ipa

  # Every push to main publishes the IPA: a rolling "nightly" pre-release always,
  # and a versioned release when CFBundleShortVersionString in Info.plist has no release yet.
  release:
    name: Publish release
    needs: [simulator, device]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      APP: TVRemote
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TVRemote.ipa
          path: dist
      - name: Publish
        run: |
          set -euo pipefail
          VER=$(sed -n 's/.*CFBundleShortVersionString<\/key><string>\([^<]*\)<.*/\1/p' Info.plist)
          [ -n "$VER" ] || { echo "no version in Info.plist"; exit 1; }
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          INSTALL='Unsigned build for iOS 6 (armv7). Install it on a jailbroken device that has AppSync Unified, for example `ideviceinstaller -i FILE`. The SHA-256 checksum is in the `.sha256` file.'

          # Rolling pre-release with the latest build of main.
          cp "dist/$APP.ipa" "dist/$APP-nightly.ipa"
          (cd dist && shasum -a 256 "$APP-nightly.ipa" > "$APP-nightly.ipa.sha256")
          printf 'Latest build of `main` (version %s, build %s, commit %s). Not a stable release.\n\n%s\n' \
            "$VER" "$GITHUB_RUN_NUMBER" "$SHORT" "${INSTALL//FILE/$APP-nightly.ipa}" > dist/nightly.md
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly "dist/$APP-nightly.ipa" "dist/$APP-nightly.ipa.sha256" \
            --target "$GITHUB_SHA" --prerelease --title "Latest build ($SHORT)" --notes-file dist/nightly.md

          # Versioned release, once per version.
          TAG="v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; raise the version in Info.plist (and CHANGELOG.md) to publish a new one."
            exit 0
          fi
          cp "dist/$APP.ipa" "dist/$APP-$VER.ipa"
          (cd dist && shasum -a 256 "$APP-$VER.ipa" > "$APP-$VER.ipa.sha256")
          awk -v v="$VER" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "See CHANGELOG.md." > dist/notes.md
          printf '\n%s\n' "${INSTALL//FILE/$APP-$VER.ipa}" >> dist/notes.md
          PRE=(); case "$VER" in 0.*|*-*) PRE=(--prerelease);; esac
          gh release create "$TAG" "dist/$APP-$VER.ipa" "dist/$APP-$VER.ipa.sha256" \
            --target "$GITHUB_SHA" ${PRE[@]+"${PRE[@]}"} --title "$APP $VER" --notes-file dist/notes.md
